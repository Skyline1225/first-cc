<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>番茄钟</h1>
      <button id="settingsBtn" class="icon-btn">⚙</button>
    </header>

    <div class="mode-tabs">
      <button class="tab active" data-mode="pomodoro">专注</button>
      <button class="tab" data-mode="short">短休息</button>
      <button class="tab" data-mode="long">长休息</button>
    </div>

    <div class="timer-display">
      <svg class="progress-ring" viewBox="0 0 200 200">
        <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
        <circle class="progress-ring-progress" cx="100" cy="100" r="90" id="progressCircle"/>
      </svg>
      <div class="time" id="timeDisplay">25:00</div>
    </div>

    <div class="session-info">
      <span id="sessionCount">第 1 个番茄</span>
    </div>

    <div class="controls">
      <button id="resetBtn" class="btn btn-secondary">重置</button>
      <button id="startBtn" class="btn btn-primary">开始</button>
    </div>

    <div class="task-section">
      <input type="text" id="taskInput" placeholder="当前任务..." maxlength="50">
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="todayPomodoros">0</span>
        <span class="stat-label">今日番茄</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="todayMinutes">0</span>
        <span class="stat-label">专注分钟</span>
      </div>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <h2>设置</h2>
    <div class="setting-item">
      <label>专注时长（分钟）</label>
      <input type="number" id="pomodoroDuration" min="1" max="60" value="25">
    </div>
    <div class="setting-item">
      <label>短休息时长（分钟）</label>
      <input type="number" id="shortDuration" min="1" max="30" value="5">
    </div>
    <div class="setting-item">
      <label>长休息时长（分钟）</label>
      <input type="number" id="longDuration" min="1" max="60" value="15">
    </div>
    <div class="setting-item">
      <label>每N个番茄后长休息</label>
      <input type="number" id="longInterval" min="2" max="10" value="4">
    </div>
    <div class="setting-item">
      <label>
        <input type="checkbox" id="autoStartBreaks" checked>
        自动开始休息
      </label>
    </div>
    <div class="setting-item">
      <label>
        <input type="checkbox" id="autoStartPomodoros">
        自动开始下一个番茄
      </label>
    </div>
    <div class="settings-actions">
      <button id="saveSettingsBtn" class="btn btn-primary">保存</button>
      <button id="cancelSettingsBtn" class="btn btn-secondary">取消</button>
    </div>
  </div>

  <audio id="ambientSound" loop>
    <source src="ambient.wav" type="audio/wav">
  </audio>

  <script src="renderer.js"></script>
</body>
</html>
